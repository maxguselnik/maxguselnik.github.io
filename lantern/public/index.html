<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фонарь">
<meta name="theme-color" content="#0E1330">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Последний фонарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1330; --dusk:#1A2150; --stone:#262E58; --line:rgba(242,232,208,.14);
  --ink:#F2E8D0; --muted:#A8A2C6; --amber:#FFC45A; --violet:#A486FF; --teal:#5FD1C2; --rose:#F08BB0; --danger:#F0705A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#0E1330;--dusk:#1A2150}}
:root[data-theme="dark"]{--night:#0E1330;--dusk:#1A2150}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--night);color:var(--ink);
  font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{height:100%;position:relative}
.screen{height:100%;display:flex;flex-direction:column}
.screen[hidden]{display:none}
h1,h2,h3{font-family:"Alegreya",Georgia,serif;margin:0;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}

/* ---------- menu ---------- */
#menu{overflow-y:auto;overflow-x:hidden}
.hero{position:relative;min-height:300px;flex:none;display:flex;align-items:flex-start;justify-content:center;
  background:radial-gradient(120% 90% at 78% 52%,rgba(255,196,90,.18),transparent 55%),linear-gradient(#0B1029,#18204D 70%,#1C2556)}
.hero h1{position:relative;z-index:2;margin-top:42px;font-size:clamp(46px,13vw,64px);line-height:.92;text-align:center;letter-spacing:-.015em;
  text-shadow:0 2px 30px rgba(255,196,90,.25)}
.hero h1 span{display:block;color:var(--amber)}
.city{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:170px;display:block}
.flame{transform-origin:303px 64px}
@media (prefers-reduced-motion:no-preference){
  .flame{animation:flick 2.4s ease-in-out infinite}
  .halo{animation:breathe 3.4s ease-in-out infinite}
}
@keyframes flick{40%{transform:scale(.93)}70%{transform:scale(1.05)}}
@keyframes breathe{50%{opacity:.65}}
.menu-body{padding:6px 22px 28px;max-width:480px;width:100%;margin:0 auto;background:var(--night)}
.lede{font-family:"Alegreya",Georgia,serif;font-size:18px;line-height:1.5;color:var(--muted);margin:0 0 22px}
.lede b{color:var(--ink);font-weight:700}
.lede b.s{color:var(--amber)} .lede b.t{color:var(--violet)}
.chap-label{font-size:14px;color:var(--muted);margin:0 0 8px}
.chapters{display:flex;gap:8px;margin-bottom:20px}
.chapters button{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--line);font:800 19px "Alegreya",Georgia,serif;color:var(--muted)}
.chapters button.on{border-color:var(--amber);color:var(--amber);background:rgba(255,196,90,.08)}
.btn{display:block;width:100%;padding:16px 18px;border-radius:16px;font-weight:800;font-size:17px;text-align:center}
.btn-main{background:var(--amber);color:#2A1C00;box-shadow:0 8px 28px -10px rgba(255,196,90,.6)}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink)}
.join{display:flex;gap:10px;margin:12px 0}
.join input{flex:1;min-width:0;background:var(--dusk);border:1.5px solid var(--line);border-radius:16px;color:var(--ink);
  font:800 22px "Alegreya Sans",sans-serif;letter-spacing:.32em;text-align:center;padding:12px;text-transform:uppercase}
.join input::placeholder{color:rgba(168,162,198,.5);letter-spacing:.2em}
.join .btn{width:auto;padding:0 22px}
.note{font-size:14px;line-height:1.45;color:var(--muted);margin:4px 0 22px}

/* ---------- lobby ---------- */
#lobby{padding:30px 22px 24px;max-width:480px;margin:0 auto;width:100%;overflow-y:auto}
.lobby-top{text-align:center;color:var(--muted);font-size:15px}
.code{font:800 64px "Alegreya",Georgia,serif;letter-spacing:.16em;text-align:center;color:var(--amber);margin:2px 0 6px;padding-left:.16em}
.sub{text-align:center;color:var(--muted);font-size:15px;line-height:1.45;margin:0 auto 22px;max-width:32ch}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{position:relative;border:1.5px solid var(--line);border-radius:20px;padding:16px 14px 14px;text-align:left;background:var(--dusk);min-height:178px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.role canvas{width:44px;height:44px;margin-bottom:2px}
.role h3{font-size:25px}
.role p{margin:0;font-size:14px;line-height:1.38;color:var(--muted)}
.role .tag{margin-top:auto;font-size:13px;font-weight:800}
.role.spark h3,.role.spark .tag{color:var(--amber)} .role.shadow h3,.role.shadow .tag{color:var(--violet)}
.role.mine.spark{border-color:var(--amber);background:linear-gradient(160deg,rgba(255,196,90,.14),var(--dusk) 60%)}
.role.mine.shadow{border-color:var(--violet);background:linear-gradient(160deg,rgba(164,134,255,.16),var(--dusk) 60%)}
.status{margin:22px 0;text-align:center;font-size:17px;min-height:26px;font-family:"Alegreya",Georgia,serif}

/* ---------- game ---------- */
#game{background:#05060F}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;z-index:3;padding:10px 14px 18px;
  background:linear-gradient(rgba(5,6,15,.85),rgba(5,6,15,0));display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
.ch small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.ch b{display:block;font-family:"Alegreya",Georgia,serif;font-size:20px;line-height:1.05;font-weight:800}
.hud-r{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--danger)}
.pill.on i{background:#7FD49A}
#menuBtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);font-size:18px;line-height:1}
.meter{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.meter span{font-size:12px;color:var(--muted);font-weight:700;min-width:76px}
.meter b{flex:1;display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.meter b i{display:block;height:100%;width:100%;background:var(--amber);border-radius:3px;transition:width .15s linear}
#pips{display:flex;gap:5px}
#pips i{width:11px;height:11px;border-radius:50%;border:2px solid var(--danger)}
#pips i.on{background:var(--danger);box-shadow:0 0 8px var(--danger)}
#toast{position:absolute;left:14px;right:14px;top:96px;z-index:4;margin:0 auto;max-width:420px;padding:11px 15px;border-radius:14px;
  background:rgba(14,19,48,.94);border:1px solid var(--line);font-family:"Alegreya",Georgia,serif;font-size:16px;line-height:1.35;
  text-align:center;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#pad{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 16px;gap:14px;background:#090C1E;border-top:1px solid rgba(255,255,255,.05)}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,50px);gap:5px}
.dpad button{border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(242,232,208,.8);font-size:18px;touch-action:none}
.dpad button.held{background:rgba(255,255,255,.16)}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.acts{display:flex;flex-direction:column;gap:10px;align-items:center}
#bLight{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#FFE3A0,var(--amber) 60%,#E09A2C);color:#2A1C00;
  font-weight:800;font-size:16px;box-shadow:0 0 30px -4px rgba(255,196,90,.7)}
#bLight.dim{background:transparent;color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
#bLight[hidden]{display:none}
.small-acts{display:flex;gap:8px}
.small-acts button{padding:10px 14px;border-radius:999px;font-weight:800;font-size:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.small-acts button[hidden]{display:none}

/* ---------- overlay ---------- */
#ov{position:absolute;inset:0;background:rgba(4,5,14,.8);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#ov[hidden]{display:none}
.card{background:var(--dusk);border:1px solid var(--line);border-radius:24px;padding:26px 22px 22px;max-width:420px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 30px 60px -20px #000}
.card .num{font-size:14px;color:var(--amber);font-weight:800;margin-bottom:6px}
.card h2{font-size:34px;line-height:1.02;margin-bottom:12px}
.card p{font-family:"Alegreya",Georgia,serif;font-size:17px;line-height:1.5;margin:0 0 12px}
.card .hint{font-family:"Alegreya Sans",sans-serif;font-size:15px;line-height:1.45;color:#D6D0EA;border-left:3px solid var(--amber);padding-left:12px}
.card .hint.sh{border-color:var(--violet)}
.card .btn{margin-top:14px}
.card .btn+.btn{margin-top:10px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.keys button{padding:16px 0;border-radius:14px;background:var(--night);border:1.5px solid var(--line);font-size:22px;font-weight:800}
.kdisp{font:800 42px "Alegreya",Georgia,serif;letter-spacing:.3em;text-align:center;color:var(--amber);min-height:54px;padding-left:.3em}
.kdisp.bad{color:var(--danger)}
</style>
</head>
<body>
<div id="app">

<section id="menu" class="screen">
  <div class="hero">
    <h1>Последний<span>фонарь</span></h1>
    <svg class="city" viewBox="0 0 390 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <radialGradient id="hg"><stop offset="0" stop-color="#FFC45A" stop-opacity=".75"/><stop offset="1" stop-color="#FFC45A" stop-opacity="0"/></radialGradient>
      </defs>
      <path fill="#121942" d="M0 120 L20 120 L20 96 L34 84 L48 96 L48 112 L70 112 L70 78 L80 78 L80 70 L92 70 L92 78 L102 78 L102 108 L126 108 L140 90 L154 108 L154 100 L178 100 L178 70 L190 58 L202 70 L202 104 L230 104 L230 88 L258 88 L258 112 L282 112 L282 98 L292 98 L292 170 L0 170Z"/>
      <path fill="#0A0E28" d="M0 140 L28 140 L28 124 L44 112 L60 124 L60 136 L96 136 L96 118 L120 118 L120 132 L150 132 L150 112 L162 102 L174 112 L174 140 L214 140 L214 122 L238 122 L238 136 L262 136 L262 126 L280 126 L280 170 L0 170Z"/>
      <rect x="135" y="116" width="5" height="7" fill="#3A3360"/><rect x="186" y="80" width="5" height="7" fill="#3A3360"/>
      <circle class="halo" cx="303" cy="64" r="70" fill="url(#hg)"/>
      <rect x="300" y="68" width="6" height="102" fill="#0A0E28"/>
      <path d="M292 58 L314 58 L310 72 L296 72Z" fill="#0A0E28"/>
      <circle class="flame" cx="303" cy="64" r="6" fill="#FFE9B8"/>
      <path d="M318 170 L318 150 Q318 136 328 136 Q338 136 338 150 L338 170Z" fill="#07060F" stroke="#A486FF" stroke-width="1.5"/>
      <circle cx="324" cy="147" r="1.8" fill="#ECE5FF"/><circle cx="332" cy="147" r="1.8" fill="#ECE5FF"/>
      <rect x="0" y="166" width="390" height="4" fill="#0E1330"/>
    </svg>
  </div>
  <div class="menu-body">
    <p class="lede">Над Вельмом поднялась Тьма. Остались двое: <b class="s">Искра</b>, которая светит, но боится темноты, и <b class="t">Тень</b>, которая ходит во мраке, но горит на свету. Зажгите пять маяков вместе.</p>
    <p class="chap-label">Начать с главы</p>
    <div class="chapters" id="chapters" role="group" aria-label="Глава"></div>
    <button class="btn btn-main" id="bCreate">Создать комнату</button>
    <div class="join">
      <input id="codeIn" maxlength="4" placeholder="КОД" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Код комнаты">
      <button class="btn btn-ghost" id="bJoin">Войти</button>
    </div>
    <p class="note" id="netNote">Подключение…</p>
    <button class="btn btn-ghost" id="bSolo">Тест на одном экране</button>
  </div>
</section>

<section id="lobby" class="screen" hidden>
  <div class="lobby-top">Комната</div>
  <div class="code" id="lCode">····</div>
  <p class="sub">Назовите код напарнику: он открывает игру у себя и вводит его.</p>
  <div class="roles">
    <button class="role spark" data-role="spark"><canvas width="88" height="88" data-portrait="spark"></canvas><h3>Искра</h3><p>Освещает ловушки и зажигает чаши. Яркий свет тратит силы и обжигает Тень.</p><span class="tag"></span></button>
    <button class="role shadow" data-role="shadow"><canvas width="88" height="88" data-portrait="shadow"></canvas><h3>Тень</h3><p>Проходит сквозь тёмные стены и воду. Читает руны в темноте.</p><span class="tag"></span></button>
  </div>
  <div class="status" id="lStatus"></div>
  <button class="btn btn-ghost" id="bLeave">Выйти из комнаты</button>
</section>

<section id="game" class="screen" hidden>
  <div id="stage">
    <canvas id="cv"></canvas>
    <header id="hud">
      <div class="ch"><small id="chapN"></small><b id="chapT"></b></div>
      <div class="hud-r"><span class="pill" id="partner"><i></i><em></em></span><button id="menuBtn" aria-label="Пауза">❚❚</button></div>
      <div class="meter"><span id="mLabel"></span><b><i id="mFill"></i></b><div id="pips"></div></div>
    </header>
    <div id="toast" role="status"></div>
  </div>
  <footer id="pad">
    <div class="dpad">
      <button class="u" data-d="0,-1" aria-label="Вверх">▲</button>
      <button class="l" data-d="-1,0" aria-label="Влево">◀</button>
      <button class="r" data-d="1,0" aria-label="Вправо">▶</button>
      <button class="d" data-d="0,1" aria-label="Вниз">▼</button>
    </div>
    <div class="acts">
      <button id="bLight">Ярче</button>
      <div class="small-acts"><button id="bPing">Позвать</button><button id="bSwap" hidden>⇄</button></div>
    </div>
  </footer>
</section>

<div id="ov" hidden><div class="card" id="ovCard"></div></div>
</div>

<script>
'use strict';
/* =========================================================
   Легенда карт:
   # стена   . пол   S/T старт Искры/Тени   D тёмная стена (только Тень)
   ~ вода (только Тень)   a b c круглые плиты → A B C двери (latch, нужны все плиты буквы разом)
   h квадратная плита → G решётка (открыта, пока на h кто-то стоит)
   x ловушка (видна только в свете)   o чаша (зажечь ярким светом рядом = чекпоинт)
   p пульс (бьёт через такт)   r руна (видит только Тень в темноте)   K замок → Z дверь

       shadow:'Встань на плиту и проходи сквозь фиолетовую стену. В дальнем зале плита того же цвета откроет Искре дверь. Не стой вплотную к яркой Искре, а рядом с тусклой — она восстанавливает силы.'},
 doors:{A:'door',B:'door'},
 map:[

'#S..#.....#.....#',

'##D##..x..#..x.E#',

       shadow:'Квадратная плита держит решётку, пока ты на ней. Пропусти Искру. Потом нажмите круглые плиты вместе. Внизу ловушки — попроси свет.'},
 doors:{A:'door'},

{name:'Затопленный рынок',

 doors:{A:'bridge',B:'door'},

       shadow:'Найди 4 руны, маленькая цифра — место в коде. Одна руна у Искры, одна за решёткой. Красные знаки внизу бьют через такт: проходи, когда погасли.'},

'#...o.....##D##',
'#..p..x..p....#',
'#EE.x....p....#',
'###############']},
{name:'Сердце Тьмы',
 intro:'В центре города бьётся Сердце Тьмы. Свет и тень должны бить по нему по очереди с одного алтаря.',
 hint:{spark:'Твой удар первый: встань на алтарь под Сердцем и вспыхни ярко. Потом уйди и пригаси свет. Красные знаки бьют через такт и всё быстрее.',
       shadow:'Твой удар второй: встань на алтарь, когда свет Искры тусклый. Потом снова её очередь.'},

function update(dt){

    const k=Math.min(1,dt*16);p.rx+=(p.x-p.rx)*k;p.ry+=(p.y-p.ry)*k;}
  if(S.overlay==='intro'||S.screen!=='play')return;
  const sp=P.spark,sh=P.shadow,tog=together(),d=cheb(sp,sh);

const cv=$('#cv'),ctx=cv.getContext('2d');

function rnd(x,y,k){let n=(x*374761393+y*668265263+k*974634581)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}

function litByBrazier(x,y){for(const i of fires){const [bx,by]=L.braz[i];if((x-bx)**2+(y-by)**2<=4.2)return true;}return false;}

function draw(now,dt){

  if(camX===null){camX=tx;camY=ty;}const ck=Math.min(1,dt*8);camX+=(tx-camX)*ck;camY+=(ty-camY)*ck;

  if(S.role==='shadow')cut(sh.rx+.5,sh.ry+.5,3.9,.82);
  dc.globalCompositeOperation='source-over';
  ctx.drawImage(dk,0,0,W,H);

  // light tint
  ctx.globalCompositeOperation='lighter';

    gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(cx-r,cy-r,r*2,r*2);};
  const warm=S.role==='shadow'?'rgba(255,170,70,.22)':'rgba(255,170,70,.13)';
  if(sparkVisible())tint(sp.rx+.5,sp.ry+.5,(sp.br?3.6:1.8)*fl,warm);
  for(const i of fires){const [bx,by]=L.braz[i];tint(bx+.5,by+.4,2.4*fl,warm);}

function renderEnd(){
  const ok=bondOk(),pc=S.solo?null:(peer&&peer.ch)||null;
  if(myChoice&&(S.solo||pc===myChoice))return renderFinal(myChoice);
  const wait=myChoice?(pc?'<p class="hint">Вы выбрали по-разному. Договоритесь и выберите вместе.</p>':'<p class="hint">Ждём выбора напарника…</p>'):'';
  overlay(`<div class="num">Финал</div><h2>Фонарщик</h2>
  <p>Тьма рассеялась. Перед вами старый Фонарщик: это он погасил город, когда потерял свой дом. Последний маяк зажжётся, только если Тень шагнёт в свет.</p>
  ${ok?'':'<p class="hint">Связь ослабла: вы слишком долго были порознь. Третий путь закрыт.</p>'}${wait}
  <button class="btn btn-ghost" id="cA">Тень шагает в свет</button>
  <button class="btn btn-main" id="cB" ${ok?'':'disabled'}>Разделить свет пополам</button>`);
  $('#cA').onclick=()=>{myChoice='give';sync();renderEnd();};
  $('#cB').onclick=()=>{myChoice='share';sync();renderEnd();};
}
function renderFinal(c){
  const txt=c==='share'
   ?'Искра отдала половину своего огня, Тень — половину своей ночи. Маяк загорелся ровным сумеречным светом. В Вельме снова есть и свет, и тень, и они идут рядом.'
   :'Тень шагнула в свет. Маяк вспыхнул, и город проснулся. Искра светит над Вельмом одна, но каждый вечер у её ног ложится чья-то тень.';
  overlay(`<div class="num">Конец</div><h2>${c==='share'?'Сумерки':'Рассвет'}</h2><p>${txt}</p>
  <p class="hint">Порознь: ${Math.round(Math.max(sep,peerSep))} с из ${BOND_LIMIT} допустимых.</p>
  <button class="btn btn-main" id="again">Сыграть снова</button><button class="btn btn-ghost" id="toMenu">В меню</button>`);
  $('#again').onclick=()=>{sep=0;peerSep=0;myChoice=null;S.screen='play';closeOverlay();loadLevel(0);};
  $('#toMenu').onclick=toMenu;
}
function toMenu(){
  closeOverlay();S.screen='menu';S.solo=false;S.role=null;S.code='';L=null;myChoice=null;sep=0;peer=null;
  if(net){net.leave();net=null;}
  renderChapters();show('menu');
}

/* ---------- menu & lobby ---------- */
function renderChapters(){
  S.start=Math.min(S.start,unlocked);
  $('#chapters').innerHTML=LEVELS.map((l,i)=>`<button data-c="${i}" class="${i===S.start?'on':''}" ${i>unlocked?'disabled':''} aria-label="Глава ${i+1}: ${l.name}" title="${l.name}">${i>unlocked?'🔒':i+1}</button>`).join('');
  $('#chapters').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.start=+b.dataset.c;renderChapters();});
}
const CODE_CH='KLMNPRSTVXZ2345679';
function newCode(){let s='';for(let i=0;i<4;i++)s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return s;}
function enterLobby(code){
  if(!netAvailable()){netNote(true);$('#netNote').scrollIntoView({block:'center',behavior:'smooth'});return;}
  S.code=code;S.role=null;S.solo=false;S.screen='lobby';peer=null;$('#lCode').textContent=code;
  openNet(code);net.presence({c:code,r:null,st:'lobby',l:0,sl:S.start});
  show('lobby');renderLobby();
}
let startT=0;
function renderLobby(){
  const pr=peer&&peer.c===S.code?peer:null;
  for(const r of ['spark','shadow']){
    const btn=document.querySelector(`.role[data-role="${r}"]`),tag=btn.querySelector('.tag'),taken=pr&&pr.r===r;
    btn.classList.toggle('mine',S.role===r);btn.disabled=!!taken&&S.role!==r;
    tag.textContent=S.role===r&&taken?'Оба выбрали — смените':S.role===r?'Это вы':taken?'Выбрал напарник':'Выбрать';
  }
  const st=$('#lStatus');
  if(!netUp)st.textContent='Подключаемся к комнате…';
  else if(!pr)st.textContent='Ждём напарника…';
  else if(!pr.r)st.textContent='Напарник в комнате. Выберите героев.';
  else if(!S.role)st.textContent=`Напарник — ${NAMES[pr.r]}. Выберите второго героя.`;
  else if(pr.r===S.role)st.textContent='Нужны разные герои.';
  else{const lvl=startLevel();st.textContent=`Начинаем главу ${lvl+1}…`;clearTimeout(startT);startT=setTimeout(startOnline,800);}
}
function startLevel(){
  if(peer&&(peer.st==='play'||peer.st==='end')&&typeof peer.l==='number'&&peer.l<LEVELS.length)return peer.l;
  return Math.max(S.start,Math.min(LEVELS.length-1,int(peer&&peer.sl,LEVELS.length-1)));
}
function startOnline(){
  if(S.screen!=='lobby'||!peer||!S.role||peer.r===S.role)return;
  S.screen='play';show('game');loadLevel(startLevel());
}
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;net&&net.presence({r:S.role});renderLobby();});
$('#bCreate').onclick=()=>enterLobby(newCode());
$('#bJoin').onclick=()=>{const c=$('#codeIn').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==4){netNote(false,'Введите код из 4 символов — его видит тот, кто создал комнату.');$('#codeIn').focus();return;}enterLobby(c);};
$('#codeIn').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);};
$('#codeIn').onkeydown=e=>{if(e.key==='Enter')$('#bJoin').click();};
$('#bLeave').onclick=toMenu;
$('#bSolo').onclick=()=>{S.solo=true;S.role='spark';S.code='';S.screen='play';show('game');loadLevel(S.start);};
$('#menuBtn').onclick=()=>{
  if(S.overlay&&S.overlay!=='intro')return;S.overlay='menu';
  overlay(`<h2>Пауза</h2>${S.solo?'':`<p class="hint">Комната ${S.code}. Напарник останется в игре.</p>`}
  <button class="btn btn-main" id="mRes">Продолжить</button><button class="btn btn-ghost" id="mIntro">Подсказка главы</button><button class="btn btn-ghost" id="mSnd">${soundOn?'Звук: вкл':'Звук: выкл'}</button><button class="btn btn-ghost" id="mOut">Выйти в меню</button>`);
  $('#mSnd').onclick=e=>{soundOn=!soundOn;store.set('sound',soundOn);e.target.textContent=soundOn?'Звук: вкл':'Звук: выкл';audioInit();sfx('ok');};$('#mRes').onclick=closeOverlay;$('#mIntro').onclick=showIntro;$('#mOut').onclick=toMenu;
};

/* ---------- input ---------- */
document.querySelectorAll('.dpad button').forEach(b=>{
  const [dx,dy]=b.dataset.d.split(',').map(Number);let iv=0;
  const stop=()=>{clearInterval(iv);iv=0;b.classList.remove('held');};
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('held');move(dx,dy);clearInterval(iv);iv=setInterval(()=>move(dx,dy),165);});
  b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
});
$('#bLight').onclick=toggleLight;$('#bPing').onclick=ping;$('#bSwap').onclick=swap;
let sw=null;
cv.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy));});
addEventListener('keydown',e=>{
  if(S.overlay==='keypad'){if(/^[0-9]$/.test(e.key))keyIn(e.key);else if(e.key==='Backspace')keyIn('del');else if(e.key==='Escape')keyIn('x');return;}
  if(S.screen!=='play')return;
  const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(m[k]){e.preventDefault();move(...m[k]);}else if(k===' '){e.preventDefault();toggleLight();}else if(k==='e')ping();else if(k==='tab'&&S.solo){e.preventDefault();swap();}
});

/* ---------- network: Claude room или свой сервер (WebSocket) ---------- */
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
const HOSTED=!IN_CLAUDE&&/^https?:$/.test(location.protocol);
let claudeRoom=null,net=null,claudeTried=!IN_CLAUDE;
const CLEAR={c:null,r:null,st:null,l:null,x:null,y:null,b:null,e:null,o:null,f:null,h:null,s:null,ch:null,pg:null,sl:null};
function netAvailable(){return IN_CLAUDE?!!claudeRoom:HOSTED;}
function netNote(fail,msg){
  const n=$('#netNote');
  if(msg){n.textContent=msg;return;}
  if(IN_CLAUDE&&!claudeTried){n.textContent='Подключение…';return;}
  if(netAvailable())n.textContent='Один создаёт комнату, второй вводит её код на своём телефоне.';
  else n.textContent=IN_CLAUDE?'Онлайн в этом окне недоступен. Откройте игру по ссылке артефакта в браузере или в приложении Claude — или играйте на опубликованном сайте.':'Онлайн работает на опубликованном сайте игры. Здесь доступен тест на одном экране.';
  if(fail)n.animate&&n.animate([{color:'#F0705A'},{color:''}],{duration:1200});
}
function openNet(code){
  if(net)net.leave();
  if(IN_CLAUDE){netUp=true;net={presence:p=>claudeRoom.presence(p).catch(()=>{}),leave:()=>claudeRoom.presence(CLEAR).catch(()=>{})};return;}
  net=wsNet(code);
}
function wsNet(code){
  let ws=null,myId=null,closed=false,retry=0,hb=0;const pres={};
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+code;
  function open(){
    try{ws=new WebSocket(url);}catch(e){return schedule();}
    ws.onopen=()=>{retry=0;netUp=true;ws.send(JSON.stringify({t:'p',d:pres}));updateHud();if(S.screen==='lobby')renderLobby();
      clearInterval(hb);hb=setInterval(()=>{try{ws.send('{"t":"ping"}');}catch(e){}},20000);};
    ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}
      if(d.t==='hello')myId=d.id;
      else if(d.t==='peers'&&Array.isArray(d.peers)){const now=Date.now();
        onPeers(d.peers.map(p=>({sameTab:p.id===myId,kind:'viewer',presence:p.p||{},updatedAt:p.u||now})));}};
    ws.onclose=()=>{netUp=false;clearInterval(hb);updateHud();if(S.screen==='lobby')renderLobby();schedule();};
    ws.onerror=()=>{};
  }
  function schedule(){if(!closed)setTimeout(open,Math.min(5000,400*2**retry++));}
  open();
  return {presence(p){for(const k in p){if(p[k]===null)delete pres[k];else pres[k]=p[k];}
      if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'p',d:p}));return Promise.resolve();},
    leave(){closed=true;clearInterval(hb);try{ws&&ws.close();}catch(e){}netUp=false;}};
}
let pending=false,syncAt=0;
function sync(){if(!S.solo&&net&&S.code)pending=true;}
function flushSync(now){
  if(!pending||now-syncAt<70||!L||!S.role||!net)return;pending=false;syncAt=now;
  const me=P[S.role];
  net.presence({c:S.code,r:S.role,st:S.screen==='end'?'end':'play',l:S.lvl,x:me.x,y:me.y,
    b:S.role==='spark'&&me.br?1:0,e:S.role==='spark'?Math.round(me.en):0,o:[...opened].join(''),f:fires.join(','),
    h:hits,s:Math.round(sep),ch:myChoice,pg:pingAt,sl:S.start});
}
const int=(v,max)=>{v=Math.round(+v);return Number.isFinite(v)?Math.max(0,Math.min(max,v)):0;};
function onPeers(peers){
  if(!S.code)return;
  const list=peers.filter(p=>!p.sameTab&&p.kind==='viewer'&&p.presence&&p.presence.c===S.code);
  list.sort((a,b)=>b.updatedAt-a.updatedAt);
  peer=list.length?list[0].presence:null;
  if(S.screen==='lobby')return renderLobby();
  if(!L||S.solo){return;}
  if(!peer)return updateHud();
  if((peer.st==='play'||peer.st==='end')&&typeof peer.l==='number'&&peer.l>S.lvl&&peer.l<LEVELS.length&&S.screen==='play'){
    unlocked=Math.max(unlocked,peer.l);store.set('unlocked',unlocked);loadLevel(peer.l);}
  if(peer.l===S.lvl&&peer.r===OTHER[S.role]){
    const o=P[peer.r];o.x=int(peer.x,L.w-1);o.y=int(peer.y,L.h-1);
    if(peer.r==='spark'){o.br=!!peer.b;o.en=int(peer.e,100);}
    for(const ch of String(peer.o||'').slice(0,8))if(isDoor(ch)&&!opened.has(ch))opened.add(ch);
    for(const s of String(peer.f||'').split(',')){if(s==='')continue;const i=int(s,99);if(i<L.braz.length&&!fires.includes(i))fires.push(i);}
    if(L.d.boss&&+peer.h>hits){hits=Math.min(4,int(peer.h,4));if(hits>=4)endGame();}
    peerSep=int(peer.s,100000);
    if(peer.pg&&peer.pg!==lastPg){lastPg=peer.pg;pingFx={who:peer.r,t:performance.now()};sfx('ping');}
  }
  if(peer.st==='end'&&S.screen==='play'&&L.d.boss)endGame();
  if(S.screen==='end')renderEnd();
  updateHud();
}
(async()=>{
  if(IN_CLAUDE){
    try{claudeRoom=await window.claude.use('room');}catch(e){claudeRoom=null;}
    claudeTried=true;
    if(claudeRoom){
      claudeRoom.onPeers(ch=>onPeers(ch.peers),()=>{claudeRoom=null;netUp=false;netNote();});
      claudeRoom.onConnection(c=>{netUp=c;updateHud();if(S.screen==='lobby')renderLobby();});
    }
  }
  netNote();
})();
if(HOSTED&&'serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
renderChapters();drawPortraits();netNote();resize();requestAnimationFrame(frame);
</script>
</body>
